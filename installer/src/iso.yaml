label: "AURORA-XPS9500-LIVE"
grub2:
  timeout: 10
  entries:
    - name: "Start aurora-xps9500 (Live)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=AURORA-XPS9500-LIVE rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Start aurora-xps9500 (Live, Basic Graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=AURORA-XPS9500-LIVE rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
