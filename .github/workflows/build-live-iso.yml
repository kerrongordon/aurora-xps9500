---
name: Build Live ISO

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-live-iso:
    name: Build Titanoboa live ISO
    # Matches build-disk.yml: bootc-image-builder/titanoboa's privileged
    # nested mounts broke outright on ubuntu-26.04 (runner-image
    # regression), so this stays on the proven ubuntu-24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Never published — exists only to feed Titanoboa. See
      # installer/Containerfile for why this isn't part of the main image.
      - name: Build installer payload image
        run: |
          sudo podman build \
            --cap-add sys_admin --security-opt label=disable --squash \
            -t localhost/aurora-xps9500-installer:latest \
            installer/

      - name: Build live ISO
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/aurora-xps9500-installer:latest
          iso-dest: ${{ github.workspace }}/output/aurora-xps9500-live-amd64.iso

      - name: Checksum
        run: |
          cd output
          sha256sum aurora-xps9500-live-amd64.iso | tee aurora-xps9500-live-amd64.iso-CHECKSUM

      - name: Upload ISO to Job Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurora-xps9500-live-iso
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
